[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bvbrc-mcp"
dynamic = ["version"]
description = "BV-BRC tools for language models, and MCP servers (HTTP and stdio) that expose them"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "requests>=2.31",
]

[project.optional-dependencies]
server = [
    "fastmcp==2.13.0.2",
    "PyJWT>=2.8",
    "authlib>=1.3",
]
pdf = ["pymupdf>=1.24"]
xlsx = ["openpyxl>=3.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
bvbrc-mcp-http = "bvbrc_mcp.server.http:main"
bvbrc-mcp-stdio = "bvbrc_mcp.server.stdio:main"

[tool.setuptools.dynamic]
version = {attr = "bvbrc_mcp.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bvbrc_mcp = ["resources/*.json", "resources/solr_collections/*.txt", "resources/service_specs/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
